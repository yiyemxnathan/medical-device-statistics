services:
  backend:
    build: ./backend
    working_dir: /app/backend
    environment:
      DATABASE_URL: sqlite:////app/backend/data/statistics.db
    volumes:
      - ./backend:/app/backend
      - app-data:/app/backend/data
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    working_dir: /app/frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app/frontend
      - frontend-node-modules:/app/frontend/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  app-data:
  frontend-node-modules:
